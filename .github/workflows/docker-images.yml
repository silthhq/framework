# Builds and publishes the official images (docker/) to GitHub Container Registry.
name: Docker images

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["docker/**", "framework/**", ".github/workflows/docker-images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CRYSTAL_VERSION: "1.22"
  ALPINE_VERSION: "3.20"

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: builder
            context: .
            version_tag: "1.22"
          - image: runtime
            context: docker
            version_tag: "3.20"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/silth-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            CRYSTAL_VERSION=${{ env.CRYSTAL_VERSION }}
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ matrix.version_tag }}
            ${{ steps.name.outputs.image }}:latest
            ${{ startsWith(github.ref, 'refs/tags/') && format('{0}:{1}', steps.name.outputs.image, github.ref_name) || '' }}
