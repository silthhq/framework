# Official images (docker/): checked on every pull request by building a fresh
# app on them and probing GET /up; published to GHCR from main (`edge`) and from
# release tags (`0.1.0`, `0.1`, `latest` and the Crystal or Alpine version).
name: Docker images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["docker/**", "src/**", "shard.yml", ".github/workflows/docker-images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CRYSTAL_VERSION: "1.22"
  ALPINE_VERSION: "3.24"

jobs:
  app:
    name: build an app on the images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the images
        run: |
          docker build -f docker/builder.Dockerfile --build-arg CRYSTAL_VERSION=$CRYSTAL_VERSION -t silthhq-builder:ci .
          docker build -f docker/runtime.Dockerfile --build-arg ALPINE_VERSION=$ALPINE_VERSION -t silthhq-runtime:ci docker
      - name: Generate an application with the builder's CLI
        run: |
          mkdir -p "$RUNNER_TEMP/apps"
          docker run --rm -v "$RUNNER_TEMP/apps:/apps" -w /apps silthhq-builder:ci \
            sh -c "silth new demo --path-to-silth=/opt/silth/framework && cd demo && shards install"
      - name: Build and run it
        run: |
          docker build -t demo:ci --build-arg SILTH_BUILDER=silthhq-builder:ci --build-arg SILTH_RUNTIME=silthhq-runtime:ci "$RUNNER_TEMP/apps/demo"
          docker run -d --name demo -p 3000:3000 -e APP_KEY="base64:$(openssl rand -base64 32)" -e DATABASE_URL="sqlite3::memory:" demo:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/up && exit 0; sleep 1; done
          docker logs demo
          exit 1

  publish:
    name: publish ${{ matrix.image }}
    needs: app
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: builder
            context: .
            base_tag: "1.22"
          - image: runtime
            context: docker
            base_tag: "3.24"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" == *-* ]]; then # pre-release: its own tag only
              tags="$image:$version"
            else
              tags="$image:$version,$image:${version%.*},$image:latest,$image:${{ matrix.base_tag }}"
            fi
          else
            tags="$image:edge"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            CRYSTAL_VERSION=${{ env.CRYSTAL_VERSION }}
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
