# Development services for Silth (framework specs, website and generated apps).
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment: { POSTGRES_USER: silth, POSTGRES_PASSWORD: silth, POSTGRES_DB: silth_test }
    ports: ["55432:5432"]
  mariadb:
    image: mariadb:11
    environment: { MARIADB_ROOT_PASSWORD: silth, MARIADB_DATABASE: silth_test, MARIADB_USER: silth, MARIADB_PASSWORD: silth }
    ports: ["53306:3306"]
  redis:
    image: redis:7-alpine
    ports: ["56379:6379"]
  mailpit:
    image: axllent/mailpit
    ports: ["51025:1025", "58025:8025"]   # SMTP / web UI
  minio:
    image: minio/minio
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: silth, MINIO_ROOT_PASSWORD: silthsecret }
    ports: ["59000:9000", "59001:9001"]
  jaeger:
    image: jaegertracing/all-in-one
    ports: ["16686:16686", "4318:4318"]   # UI / OTLP HTTP
