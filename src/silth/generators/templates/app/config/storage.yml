default: local
disks:
  local:
    driver: local
    root: storage/app
    url: /files
  public:
    driver: local
    root: public/uploads
    url: /uploads
  s3:
    driver: s3
    bucket: ${S3_BUCKET:-}
    region: ${S3_REGION:-us-east-1}
    key: ${S3_KEY:-}
    secret: ${S3_SECRET:-}
    endpoint: ${S3_ENDPOINT:-}
    path_style: false
